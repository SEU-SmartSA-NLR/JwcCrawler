[package]
name = "jwc-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.2", features = ["blocking"] }
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
libc = "0.2"
clap = { version = "4.5.60", features = ["derive"] }
url = "2.5.8"
sha2 = "0.11.0-rc.5"
chrono = { version = "0.4.44", features = ["serde"] }
htmd = "0.5.1"
regex = "1.12.3"